{{- $kind := ternary "Rollout" "Deployment" .Values.api.canary.enabled -}}
{{- $apiVersion := ternary "argoproj.io/v1alpha1" "apps/v1" .Values.api.canary.enabled -}}
apiVersion: {{ $apiVersion }}
kind: {{ $kind }}
metadata:
  name: {{ .Release.Name }}-api
  labels: {{- include "shopcore.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  {{- if not .Values.api.hpa.enabled }}
  replicas: {{ .Values.api.replicas }}
  {{- end }}
  revisionHistoryLimit: 5
  selector:
    matchLabels: {{- include "shopcore.selector" . | nindent 6 }}
      app.kubernetes.io/component: api
  {{- if .Values.api.canary.enabled }}
  strategy:
    canary:
      # Progressive delivery: 5% -> 25% -> 50% -> 100%, each step gated by Prometheus analysis.
      # A failed analysis aborts and shifts all traffic back to the stable ReplicaSet automatically.
      maxSurge: "25%"
      maxUnavailable: 0
      analysis:
        templates:
          - templateName: {{ .Release.Name }}-slo
        startingStep: 1
      steps:
        - setWeight: 5
        - pause: { duration: 5m }
        - setWeight: 25
        - pause: { duration: 5m }
        - setWeight: 50
        - pause: { duration: 10m }
  {{- else }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0       # never drop below current capacity during a deploy
  {{- end }}
  template:
    metadata:
      labels: {{- include "shopcore.selector" . | nindent 8 }}
        app.kubernetes.io/component: api
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/config.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ .Release.Name }}
      terminationGracePeriodSeconds: {{ .Values.api.terminationGracePeriodSeconds }}
      # Spread evenly across AZs and nodes so losing a zone or node removes a bounded share of capacity.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels: {{- include "shopcore.selector" . | nindent 14 }}
              app.kubernetes.io/component: api
        - maxSkew: 2
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {{- include "shopcore.selector" . | nindent 14 }}
              app.kubernetes.io/component: api
      containers:
        - name: api
          image: {{ include "shopcore.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- include "shopcore.env" . | nindent 10 }}
            - name: WORKERS
              value: "1"
          ports:
            - { name: http, containerPort: 8080 }
            - { name: metrics, containerPort: 9464 }
          startupProbe:
            httpGet: { path: /health/ready, port: http }
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          livenessProbe:
            # Generous: liveness restarts are for wedged processes, not slow ones.
            httpGet: { path: /health/live, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          lifecycle:
            preStop:
              sleep: { seconds: {{ .Values.api.preStopSleepSeconds }} }
          resources: {{- toYaml .Values.api.resources | nindent 12 }}
          {{- include "shopcore.securityContext" . | nindent 10 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-api
  labels: {{- include "shopcore.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  selector: {{- include "shopcore.selector" . | nindent 4 }}
    app.kubernetes.io/component: api
  ports:
    - { name: http, port: 80, targetPort: http }
    - { name: metrics, port: 9464, targetPort: metrics }
{{- if .Values.api.hpa.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ .Release.Name }}-api
  labels: {{- include "shopcore.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: {{ $apiVersion }}
    kind: {{ $kind }}
    name: {{ .Release.Name }}-api
  minReplicas: {{ .Values.api.hpa.minReplicas }}
  maxReplicas: {{ .Values.api.hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: {{ .Values.api.hpa.targetCPUUtilization }} }
  behavior:
    # Scale up fast (traffic spikes), scale down slowly (avoid flapping and cold-pod churn).
    scaleUp:
      stabilizationWindowSeconds: 0
      selectPolicy: Max
      policies:
        - { type: Percent, value: 100, periodSeconds: 30 }
        - { type: Pods, value: 10, periodSeconds: 30 }
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - { type: Percent, value: 10, periodSeconds: 60 }
{{- end }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ .Release.Name }}-api
  labels: {{- include "shopcore.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.api.pdb.minAvailable }}
  selector:
    matchLabels: {{- include "shopcore.selector" . | nindent 6 }}
      app.kubernetes.io/component: api
{{- if .Values.api.canary.enabled }}
---
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: {{ .Release.Name }}-slo
spec:
  metrics:
    - name: error-rate
      interval: 1m
      failureLimit: 1
      successCondition: result[0] < 0.005
      provider:
        prometheus:
          address: http://prometheus-operated.monitoring:9090
          query: |
            sum(rate(http_request_duration_seconds_count{namespace="{{ .Release.Namespace }}",status=~"5..",status!="503"}[2m]))
            / clamp_min(sum(rate(http_request_duration_seconds_count{namespace="{{ .Release.Namespace }}"}[2m])), 1)
    - name: p99-latency
      interval: 1m
      failureLimit: 1
      successCondition: result[0] < 0.15
      provider:
        prometheus:
          address: http://prometheus-operated.monitoring:9090
          query: |
            histogram_quantile(0.99, sum by (le) (rate(http_request_duration_seconds_bucket{namespace="{{ .Release.Namespace }}",route!~"/health.*"}[2m])))
{{- end }}
