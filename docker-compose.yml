# Local development stack: Postgres, Redis, Redpanda (Kafka API), API, worker, migrations.
#   npm run dev:keys && docker compose up --build
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: shopcore
    ports: ["5432:5432"]
    command: ["postgres", "-c", "max_connections=300", "-c", "shared_buffers=512MB"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      retries: 30

  redis:
    image: redis:7
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
    ports: ["6379:6379"]

  redpanda:
    image: redpandadata/redpanda:v24.2.7
    command: ["redpanda", "start", "--overprovisioned", "--smp", "1", "--memory", "512M", "--kafka-addr", "0.0.0.0:9092", "--advertise-kafka-addr", "redpanda:9092"]
    ports: ["9092:9092"]

  migrate:
    build: .
    command: ["dist/scripts/migrate.js"]
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/shopcore
    depends_on:
      postgres: { condition: service_healthy }

  api:
    build: .
    ports: ["8080:8080", "9464:9464"]
    env_file: .env.example
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/shopcore
      REDIS_URL: redis://redis:6379
      JWT_PUBLIC_KEY_FILE: /keys/public.pem
    volumes:
      - ./.dev-keys:/keys:ro
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_started }

  worker:
    build: .
    env_file: .env.example
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/shopcore
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: redpanda:9092
      METRICS_PORT: "9465"
    command: ["dist/src/worker.js"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redpanda: { condition: service_started }
